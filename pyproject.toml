[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mrclean"
version = "0.1.0.dev0"
description = "Re-runnable data broker scan and opt-out tool. Personal data stays local, never in the repo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MRGoodbar-931" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "keyring>=25",
    "sqlcipher3-wheels>=0.5.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4"]

[project.scripts]
mrclean = "mrclean.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mrclean"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
