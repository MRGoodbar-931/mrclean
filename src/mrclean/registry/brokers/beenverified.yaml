id: beenverified
name: BeenVerified
url: https://www.beenverified.com
category: background_check
priority: 1
covers: [PeopleLooker, PeopleSmart]
search:
  method: manual
optout:
  method: web_form
  url: https://www.beenverified.com/app/optout/search
  requires: [first, last, state, email]
  verification: [email_link]
  notes: >-
    Required fields not stated by the source; the requires list is a guess, so confirm it
    on the live form. Only one opt-out per email address. Property records have a separate form at
    https://www.beenverified.com/app/optout/address-search.
sources:
